<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#070b13" />
<title>网球反应力 · Tennis Reflex</title>
<style>
  :root {
    --bg: #070b13;
    --panel: rgba(18, 28, 44, 0.72);
    --text: #e9f1ff;
    --muted: #8fa3bf;
    --accent: #d6f04a;
    --cyan: #6fe3ff;
    --danger: #ff5f7a;
    --vh: 100vh;
    --stage-max: calc((100vh - 210px) * 0.75);
  }

  @supports (height: 100dvh) {
    :root {
      --vh: 100dvh;
      --stage-max: calc((100dvh - 200px) * 0.75);
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: var(--vh);
  }

  body {
    margin: 0;
    min-height: var(--vh);
    padding: 20px 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(1000px 620px at 50% -10%, #16233a 0%, var(--bg) 62%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
    overflow: hidden;
  }

  .game {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ---------- HUD ---------- */
  .hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 16px;
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }

  .hud-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 68px;
  }

  .hud-item:nth-child(2) {
    align-items: center;
  }

  .hud-item:last-child {
    align-items: flex-end;
  }

  .hud-label {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .hud-value {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  #lives {
    color: var(--danger);
    font-size: 19px;
    letter-spacing: 3px;
  }

  /* ---------- 球场 ---------- */
  .stage {
    position: relative;
    width: 100%;
    margin: 0 auto;
    max-width: min(480px, var(--stage-max));
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 24px 50px rgba(0, 0, 0, 0.55);
    line-height: 0;
    touch-action: none;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #060b14;
    touch-action: none;
  }

  /* ---------- 浮层 ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(6, 11, 20, 0.72);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s ease;
    line-height: 1.5;
  }

  .overlay.is-visible {
    opacity: 1;
    visibility: visible;
  }

  .panel {
    width: 100%;
    max-width: 320px;
    padding: 24px 20px;
    text-align: center;
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(30, 45, 68, 0.96), rgba(14, 22, 35, 0.96));
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    transform: translateY(10px) scale(0.97);
    transition: transform 0.25s ease;
  }

  .overlay.is-visible .panel {
    transform: translateY(0) scale(1);
  }

  .panel-title {
    margin: 0 0 10px;
    font-size: 23px;
    font-weight: 700;
  }

  .panel-text {
    margin: 0 0 20px;
    font-size: 14px;
    color: var(--muted);
  }

  .panel-text strong {
    color: var(--accent);
  }

  kbd {
    display: inline-block;
    min-width: 24px;
    padding: 2px 6px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
  }

  .btn {
    width: 100%;
    padding: 14px 20px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #0a1018;
    background: linear-gradient(180deg, #e8ff74, #c3e01f);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(198, 226, 30, 0.25);
    transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }

  .btn:hover {
    filter: brightness(1.06);
    box-shadow: 0 14px 28px rgba(198, 226, 30, 0.35);
  }

  .btn:active {
    transform: translateY(1px) scale(0.99);
  }

  .btn:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
  }

  /* ---------- 触屏设备：只显示触摸说明 ---------- */
  .only-touch {
    display: none;
  }

  @media (pointer: coarse) {
    .only-keyboard {
      display: none;
    }

    .only-touch {
      display: inline;
    }

    body {
      padding: 12px 10px;
    }
  }

  @media (max-height: 640px) {
    .hint {
      display: none;
    }
  }
</style>
</head>
<body>
  <main class="game">
    <header class="hud">
      <div class="hud-item">
        <span class="hud-label">Score</span>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Lives</span>
        <span class="hud-value" id="lives">♥♥♥</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Level</span>
        <span class="hud-value" id="level">1</span>
      </div>
    </header>

    <div class="stage">
      <canvas id="court" width="480" height="640"></canvas>

      <div class="overlay is-visible" id="overlay">
        <div class="panel">
          <h1 class="panel-title" id="overlayTitle">网球反应力</h1>
          <p class="panel-text" id="overlayText">
            <span class="only-keyboard">用 <kbd>←</kbd> <kbd>→</kbd> 移动球拍，接住落下的网球</span>
            <span class="only-touch">按住屏幕左右拖动，让球拍接住落下的网球</span>
          </p>
          <button class="btn" id="overlayBtn" type="button">开始游戏</button>
        </div>
      </div>
    </div>

    <p class="hint">
      <span class="only-keyboard">← → 移动球拍 · 每接 5 球升 1 级，球会更快</span>
      <span class="only-touch">按住屏幕左右拖动 · 每接 5 球升 1 级，球会更快</span>
    </p>
  </main>

<script>
/* Tennis Reflex — 单文件版（无任何依赖，双击即可运行）
   键盘 ← → 或 触屏拖动控制球拍。 */
(function () {
  "use strict";

  /* ================= 基础元素 ================= */
  const canvas = document.getElementById("court");
  const ctx = canvas.getContext("2d");

  const scoreEl = document.getElementById("score");
  const livesEl = document.getElementById("lives");
  const levelEl = document.getElementById("level");

  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlayText = document.getElementById("overlayText");
  const overlayBtn = document.getElementById("overlayBtn");

  /* ================= 尺寸 & 配置 ================= */
  const W = 480; // 逻辑宽度
  const H = 640; // 逻辑高度

  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const COURT = { x: 24, y: 26, w: W - 48, h: 578 };

  const PADDLE_W = 96;
  const PADDLE_H = 14;
  const PADDLE_Y = 566;
  const PADDLE_SPEED = 640; // px / 秒
  const PADDLE_INSET = 8;

  const BALL_R = 10;
  const BASE_SPEED = 220;
  const SPEED_PER_LEVEL = 48;
  const MAX_SPEED = 880;

  const POINTS_PER_LEVEL = 5;
  const MAX_LEVEL = 12;

  const BASE_SPAWN_DELAY = 0.55;
  const MIN_SPAWN_DELAY = 0.18;

  const START_LIVES = 3;

  /* ================= 状态 ================= */
  const state = {
    phase: "ready", // ready | playing | over
    score: 0,
    lives: START_LIVES,
    level: 1,
    paddleX: W / 2 - PADDLE_W / 2,
    paddleV: 0,
    paddleHit: 0,
    ball: null,
    spawnTimer: 0,
    toast: null,
    flash: 0,
    pointerActive: false,
    pointerX: W / 2
  };

  const keys = { left: false, right: false };

  /* ================= 小工具 ================= */
  function clamp(v, min, max) {
    return v < min ? min : v > max ? max : v;
  }

  function paddleMinX() {
    return COURT.x + PADDLE_INSET;
  }

  function paddleMaxX() {
    return COURT.x + COURT.w - PADDLE_INSET - PADDLE_W;
  }

  function speedForLevel(level) {
    return Math.min(MAX_SPEED, BASE_SPEED + (level - 1) * SPEED_PER_LEVEL);
  }

  function spawnDelayForLevel(level) {
    return Math.max(MIN_SPAWN_DELAY, BASE_SPAWN_DELAY - (level - 1) * 0.03);
  }

  function levelForScore(score) {
    return Math.min(MAX_LEVEL, 1 + Math.floor(score / POINTS_PER_LEVEL));
  }

  function roundRect(x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  /* ================= HUD & 浮层 ================= */
  function updateHud() {
    scoreEl.textContent = String(state.score);
    levelEl.textContent = String(state.level);
    livesEl.textContent =
      "♥".repeat(Math.max(0, state.lives)) + "♡".repeat(Math.max(0, START_LIVES - state.lives));
  }

  function showOverlay(title, html, buttonText) {
    overlayTitle.textContent = title;
    overlayText.innerHTML = html;
    overlayBtn.textContent = buttonText;
    overlay.classList.add("is-visible");
  }

  function hideOverlay() {
    overlay.classList.remove("is-visible");
  }

  function hintHtml(kb, touch) {
    return (
      '<span class="only-keyboard">' + kb + '</span>' +
      '<span class="only-touch">' + touch + "</span>"
    );
  }

  /* ================= 游戏流程 ================= */
  function resetGame() {
    state.score = 0;
    state.lives = START_LIVES;
    state.level = 1;
    state.paddleV = 0;
    state.paddleHit = 0;
    state.ball = null;
    state.spawnTimer = 0.4;
    state.toast = null;
    state.flash = 0;
    state.pointerActive = false;
    state.paddleX = clamp(W / 2 - PADDLE_W / 2, paddleMinX(), paddleMaxX());
    updateHud();
  }

  function startGame() {
    resetGame();
    state.phase = "playing";
    hideOverlay();
    spawnBall();
  }

  function endGame() {
    state.phase = "over";
    state.ball = null;
    state.flash = 1;
    showOverlay(
      "Game Over",
      "本局得分 <strong>" + state.score + "</strong> · 到达 Level " + state.level,
      "Restart"
    );
  }

  function startOrRestart() {
    if (state.phase === "playing") return;
    startGame();
  }

  function spawnBall() {
    const minX = COURT.x + BALL_R + 12;
    const maxX = COURT.x + COURT.w - BALL_R - 12;
    state.ball = {
      x: minX + Math.random() * (maxX - minX),
      y: COURT.y - BALL_R,
      r: BALL_R,
      vy: speedForLevel(state.level),
      angle: 0
    };
  }

  /* ================= 更新逻辑 ================= */
  function updatePaddle(dt) {
    if (state.pointerActive) {
      // 触屏 / 鼠标：朝手指位置移动，速度上限与键盘一致
      const delta = state.pointerX - (state.paddleX + PADDLE_W / 2);
      const maxStep = PADDLE_SPEED * dt;
      const step = Math.abs(delta) < 1 ? delta : clamp(delta, -maxStep, maxStep);
      state.paddleX = clamp(state.paddleX + step, paddleMinX(), paddleMaxX());
      state.paddleV = dt > 0 ? step / dt : 0;
    } else {
      // 键盘：平滑加减速，更有手感
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      const targetV = dir * PADDLE_SPEED;
      state.paddleV += (targetV - state.paddleV) * Math.min(1, dt * 16);
      state.paddleX = clamp(state.paddleX + state.paddleV * dt, paddleMinX(), paddleMaxX());
      if (state.paddleX <= paddleMinX() || state.paddleX >= paddleMaxX()) {
        state.paddleV = 0;
      }
    }

    state.paddleHit = Math.max(0, state.paddleHit - dt * 5.5);
  }

  function updateBall(dt) {
    const ball = state.ball;

    if (!ball) {
      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) spawnBall();
      return;
    }

    ball.y += ball.vy * dt;
    ball.angle += dt * (4 + ball.vy / 140);

    const paddleTop = PADDLE_Y;
    const paddleBottom = PADDLE_Y + PADDLE_H;
    const paddleLeft = state.paddleX;
    const paddleRight = state.paddleX + PADDLE_W;

    const hitPaddle =
      ball.y + ball.r >= paddleTop &&
      ball.y - ball.r <= paddleBottom &&
      ball.x + ball.r * 0.6 >= paddleLeft &&
      ball.x - ball.r * 0.6 <= paddleRight;

    if (hitPaddle) {
      state.score += 1;

      const newLevel = levelForScore(state.score);
      if (newLevel > state.level) {
        state.level = newLevel;
        state.toast = { text: "Level " + state.level, t: 1 };
      }

      state.paddleHit = 1;
      state.ball = null;
      state.spawnTimer = spawnDelayForLevel(state.level);
      updateHud();
      return;
    }

    if (ball.y - ball.r > COURT.y + COURT.h) {
      state.lives -= 1;
      state.ball = null;
      state.spawnTimer = 0.35;
      state.flash = 0.8;
      updateHud();

      if (state.lives <= 0) endGame();
    }
  }

  function update(dt) {
    if (state.phase === "playing") {
      updatePaddle(dt);
      updateBall(dt);
    } else {
      state.paddleHit = Math.max(0, state.paddleHit - dt * 5.5);
    }

    if (state.toast) {
      state.toast.t -= dt * 1.4;
      if (state.toast.t <= 0) state.toast = null;
    }

    state.flash = Math.max(0, state.flash - dt * 2.2);
  }

  /* ================= 绘制 ================= */
  function drawCourt() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#0b1626");
    bg.addColorStop(1, "#060b14");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const x = COURT.x;
    const y = COURT.y;
    const w = COURT.w;
    const h = COURT.h;

    const surface = ctx.createLinearGradient(0, y, 0, y + h);
    surface.addColorStop(0, "#134a3d");
    surface.addColorStop(0.5, "#0f3d33");
    surface.addColorStop(1, "#0b3129");

    ctx.save();
    ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
    ctx.shadowBlur = 24;
    ctx.shadowOffsetY = 8;
    roundRect(x, y, w, h, 16);
    ctx.fillStyle = surface;
    ctx.fill();
    ctx.restore();

    ctx.save();
    roundRect(x, y, w, h, 16);
    ctx.clip();

    const inset = 14;
    const bx = x + inset;
    const by = y + inset;
    const bw = w - inset * 2;
    const bh = h - inset * 2;
    const netY = by + bh / 2;
    const alley = bw * 0.07;
    const service = bh * 0.26;

    ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
    ctx.lineWidth = 2.5;
    ctx.lineJoin = "round";

    ctx.strokeRect(bx, by, bw, bh);

    ctx.beginPath();
    ctx.moveTo(bx + alley, by);
    ctx.lineTo(bx + alley, by + bh);
    ctx.moveTo(bx + bw - alley, by);
    ctx.lineTo(bx + bw - alley, by + bh);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(bx + alley, netY - service);
    ctx.lineTo(bx + bw - alley, netY - service);
    ctx.moveTo(bx + alley, netY + service);
    ctx.lineTo(bx + bw - alley, netY + service);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(bx + bw / 2, netY - service);
    ctx.lineTo(bx + bw / 2, netY + service);
    ctx.stroke();

    ctx.strokeStyle = "rgba(234, 247, 200, 0.85)";
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 6]);
    ctx.beginPath();
    ctx.moveTo(bx - 6, netY);
    ctx.lineTo(bx + bw + 6, netY);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.restore();
  }

  function drawBall(ball) {
    const r = ball.r;

    ctx.save();
    ctx.translate(ball.x, ball.y);

    ctx.shadowColor = "rgba(214, 240, 74, 0.75)";
    ctx.shadowBlur = 18;

    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.15, 0, 0, r);
    g.addColorStop(0, "#fbffc9");
    g.addColorStop(0.55, "#dfef4f");
    g.addColorStop(1, "#a8c314");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.rotate(ball.angle);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.clip();

    ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(-r * 0.95, 0, r * 1.05, -1.05, 1.05);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(r * 0.95, 0, r * 1.05, Math.PI - 1.05, Math.PI + 1.05);
    ctx.stroke();

    ctx.restore();
  }

  function drawPaddle() {
    const squash = state.paddleHit;
    const cx = state.paddleX + PADDLE_W / 2;
    const cy = PADDLE_Y + PADDLE_H / 2;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1 + squash * 0.14, 1 - squash * 0.45);
    ctx.translate(-PADDLE_W / 2, -PADDLE_H / 2);

    ctx.shadowColor = "rgba(111, 227, 255, " + (0.45 + squash * 0.55).toFixed(3) + ")";
    ctx.shadowBlur = 16 + squash * 22;

    const g = ctx.createLinearGradient(0, 0, 0, PADDLE_H);
    g.addColorStop(0, "#eafcff");
    g.addColorStop(0.5, "#6fe3ff");
    g.addColorStop(1, "#2aa8d8");

    roundRect(0, 0, PADDLE_W, PADDLE_H, PADDLE_H / 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = "rgba(255, 255, 255, 0.28)";
    roundRect(PADDLE_W / 2 - 5, PADDLE_H - 1, 10, 12, 4);
    ctx.fill();

    ctx.restore();
  }

  function drawToast() {
    const toast = state.toast;
    if (!toast) return;

    ctx.save();
    ctx.globalAlpha = Math.min(1, toast.t);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "700 34px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "rgba(214, 240, 74, 0.95)";
    ctx.shadowColor = "rgba(214, 240, 74, 0.6)";
    ctx.shadowBlur = 18;
    const y = COURT.y + COURT.h * 0.33 - (1 - toast.t) * 30;
    ctx.fillText(toast.text, W / 2, y);
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawCourt();
    if (state.ball) drawBall(state.ball);
    drawPaddle();
    drawToast();

    if (state.flash > 0) {
      ctx.fillStyle = "rgba(255, 92, 92, " + (state.flash * 0.22).toFixed(3) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ================= 主循环 ================= */
  let lastTime = 0;

  function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (dt > 0.05) dt = 0.05;

    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* ================= 键盘 ================= */
  window.addEventListener("keydown", function (event) {
    const key = event.key;

    if (key === "ArrowLeft" || key === "ArrowRight") {
      event.preventDefault();
      if (key === "ArrowLeft") {
        keys.left = true;
      } else {
        keys.right = true;
      }
      if (state.phase === "ready") startGame();
      return;
    }

    if ((key === " " || key === "Enter") && state.phase !== "playing") {
      if (document.activeElement === overlayBtn) return;
      event.preventDefault();
      startOrRestart();
    }
  });

  window.addEventListener("keyup", function (event) {
    if (event.key === "ArrowLeft") keys.left = false;
    if (event.key === "ArrowRight") keys.right = false;
  });

  window.addEventListener("blur", function () {
    keys.left = false;
    keys.right = false;
    state.pointerActive = false;
  });

  /* ================= 触屏 / 鼠标 ================= */
  function canvasXFromClient(clientX) {
    const rect = canvas.getBoundingClientRect();
    if (!rect || !rect.width) return W / 2;
    return ((clientX - rect.left) / rect.width) * W;
  }

  function pointerDownAt(clientX) {
    state.pointerX = clamp(canvasXFromClient(clientX), 0, W);
    state.pointerActive = true;
  }

  function attachPointerControls() {
    if (window.PointerEvent) {
      canvas.addEventListener("pointerdown", function (event) {
        if (event.cancelable) event.preventDefault();
        pointerDownAt(event.clientX);
      });
      canvas.addEventListener("pointermove", function (event) {
        if (!state.pointerActive) return;
        if (event.cancelable) event.preventDefault();
        state.pointerX = clamp(canvasXFromClient(event.clientX), 0, W);
      });
      const stop = function () {
        state.pointerActive = false;
      };
      canvas.addEventListener("pointerup", stop);
      canvas.addEventListener("pointercancel", stop);
      canvas.addEventListener("pointerleave", stop);
    } else {
      canvas.addEventListener(
        "touchstart",
        function (event) {
          event.preventDefault();
          if (event.touches && event.touches.length) pointerDownAt(event.touches[0].clientX);
        },
        { passive: false }
      );
      canvas.addEventListener(
        "touchmove",
        function (event) {
          event.preventDefault();
          if (state.pointerActive && event.touches && event.touches.length) {
            state.pointerX = clamp(canvasXFromClient(event.touches[0].clientX), 0, W);
          }
        },
        { passive: false }
      );
      canvas.addEventListener("touchend", function () {
        state.pointerActive = false;
      });
      canvas.addEventListener("mousedown", function (event) {
        pointerDownAt(event.clientX);
      });
      window.addEventListener("mousemove", function (event) {
        if (state.pointerActive) state.pointerX = clamp(canvasXFromClient(event.clientX), 0, W);
      });
      window.addEventListener("mouseup", function () {
        state.pointerActive = false;
      });
    }
  }

  overlayBtn.addEventListener("click", function () {
    startOrRestart();
  });

  /* ================= 启动 ================= */
  attachPointerControls();
  resetGame();
  state.phase = "ready";
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
